<svg xmlns="http://www.w3.org/2000/svg"
     width="1240"
     height="800"
     viewBox="0 0 1240 800"
     fill="none">

  <defs>

    <!-- Размытие световых пятен -->
    <filter id="light-blur"
            x="-150%"
            y="-150%"
            width="400%"
            height="400%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="167"/>
    </filter>

    <!-- Мелкозернистая текстура освещения -->
    <filter id="light-noise"
            x="0"
            y="0"
            width="100%"
            height="100%"
            color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.9"
                    numOctaves="3"
                    stitchTiles="stitch"
                    result="noise"/>
      <feComposite in="noise"
                   in2="SourceAlpha"
                   operator="in"/>
    </filter>

    <!-- Маска областей освещения -->
    <mask id="light-mask">
      <g filter="url(#light-blur)" fill="#FFFFFF">

        <ellipse cx="883"
                 cy="497.5"
                 rx="212"
                 ry="211.5"
                 opacity="0.5"/>

        <ellipse cx="408"
                 cy="281.5"
                 rx="230"
                 ry="229.5"
                 opacity="0.49"/>

        <ellipse cx="638"
                 cy="90.5"
                 rx="230"
                 ry="229.5"
                 opacity="0.89"/>

      </g>
    </mask>

  </defs>

  <!-- Основной фон композиции -->
  <rect width="1240"
        height="800"
        fill="#A29C9A"/>

  <!-- Оранжевое освещение — Ellipse 62 -->
  <ellipse cx="883"
           cy="497.5"
           rx="212"
           ry="211.5"
           fill="#FF976A"
           opacity="0.5"
           filter="url(#light-blur)"/>

  <!-- Бежевое освещение — Ellipse 63 -->
  <ellipse cx="408"
           cy="281.5"
           rx="230"
           ry="229.5"
           fill="#F5D4AC"
           opacity="0.49"
           filter="url(#light-blur)"/>

  <!-- Белое освещение — Ellipse 64 -->
  <ellipse cx="638"
           cy="90.5"
           rx="230"
           ry="229.5"
           fill="#FFFFFF"
           opacity="0.89"
           filter="url(#light-blur)"/>

  <!-- Приближённое воспроизведение шума Figma -->
  <g mask="url(#light-mask)" opacity="0.28">
    <rect width="1240"
          height="800"
          fill="#FFFFFF"
          filter="url(#light-noise)"/>
  </g>

</svg>