name: Optimize raster imagery

on:
  push:
    paths:
      - .github/workflows/optimize-images.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Оптимизация изображений
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("public/images/slide-02/slide-02-model.png")
          target = source.with_suffix(".webp")

          with Image.open(source) as original:
              image = original.convert("RGBA")
              image.thumbnail((1400, 2300), Image.Resampling.LANCZOS)
              image.save(target, format="WEBP", quality=90, method=6)
              print(f"Модель: {original.size} -> {image.size}")
              print(f"Размер: {source.stat().st_size} -> {target.stat().st_size} байт")

          markup = Path("index.html")
          text = markup.read_text(encoding="utf-8")
          before = "/images/slide-02/slide-02-model.png"
          after = "/images/slide-02/slide-02-model.webp"
          if text.count(before) != 1:
              raise RuntimeError("Ссылка на модель не найдена или дублируется")
          markup.write_text(text.replace(before, after), encoding="utf-8")

          for unused in (
              "public/images/slide-01/slide-01-main-mobile.png",
              "public/images/slide-02/slide-02-device.png",
          ):
              Path(unused).unlink()

          source.unlink()
          PY
      - name: Сохранение оптимизированных ресурсов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images/ index.html
          git commit -m "perf: optimize model image and remove unused assets"
          git push origin HEAD:main
