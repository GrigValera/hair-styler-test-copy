name: Mobile layout verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Проверка алгоритма сравнения изображений
        run: python tests/test_pixel_comparison.py
      # Устанавливаем браузер только для проверки, не меняя зависимости проекта.
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Проверка мобильной вёрстки
        run: node tests/mobile-layout.mjs
      - name: Проверка десктопной вёрстки
        run: node tests/desktop-layout.mjs
      - name: Проверка Firefox и WebKit
        run: node tests/cross-browser.mjs
      - name: Скриншоты проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-layout-screenshots
          path: test-results/
          if-no-files-found: ignore
