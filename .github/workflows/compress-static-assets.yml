name: Compress static assets

on:
  push:
    paths:
      - .github/workflows/compress-static-assets.yml

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 fonttools==4.63.0 brotli==1.2.0
      - name: Сжатие шрифта и изображений без потерь
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from fontTools.ttLib import TTFont

          source = Path("public/fonts/Montserrat-Variable.ttf")
          output = source.with_suffix(".woff2")
          font = TTFont(str(source))
          font.flavor = "woff2"
          font.save(str(output))
          font.close()

          result = TTFont(str(output))
          if "fvar" not in result or result["OS/2"].usWeightClass != 100:
              raise ValueError("Нарушена структура вариативного шрифта")
          result.close()

          styles = Path("src/styles/_fonts.scss")
          css = styles.read_text(encoding="utf-8")
          if css.count("Montserrat-Variable.ttf") != 1:
              raise RuntimeError("Подключение шрифта не найдено")
          css = css.replace("Montserrat-Variable.ttf", "Montserrat-Variable.woff2")
          css = css.replace("format('truetype')", "format('woff2')")
          styles.write_text(css, encoding="utf-8")
          print(f"Шрифт: {source.stat().st_size} -> {output.stat().st_size} байт")
          source.unlink()

          markup = Path("index.html")
          html = markup.read_text(encoding="utf-8")
          assets = [
              "public/images/slide-01-main.png",
              "public/images/slide-01-hairdryer.png",
              "public/images/slide-01-styler.png",
              "public/images/slide-03/slide-03-technology.png",
          ]

          for name in assets:
              source = Path(name)
              target = source.with_suffix(".webp")
              with Image.open(source) as original_image:
                  original = original_image.convert("RGBA")
                  original.save(target, format="WEBP", lossless=True, method=6)

              with Image.open(target) as webp_image:
                  converted = webp_image.convert("RGBA")
                  if original.size != converted.size:
                      raise RuntimeError(f"Изменён размер: {source}")
                  for background_color in ("#746d68", "#ffffff"):
                      background = Image.new("RGBA", original.size, background_color)
                      before = Image.alpha_composite(background, original)
                      after = Image.alpha_composite(background, converted)
                      if before.tobytes() != after.tobytes():
                          raise RuntimeError(f"Изменены видимые пиксели: {source}")

              if target.stat().st_size >= source.stat().st_size:
                  target.unlink()
                  print(f"Оставлен PNG: {source.name}")
                  continue

              old = "/" + name.removeprefix("public/")
              new = "/" + str(target).removeprefix("public/")
              if html.count(old) != 1:
                  raise RuntimeError(f"Ссылка на изображение не найдена: {old}")
              html = html.replace(old, new)
              print(f"{source.name}: {source.stat().st_size} -> "
                    f"{target.stat().st_size} байт")
              source.unlink()

          markup.write_text(html, encoding="utf-8")
          PY
      - name: Сохранение оптимизированных ресурсов
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/fonts/ public/images/ index.html src/styles/_fonts.scss
          git commit -m "perf: reduce image and font transfer sizes"
          git push origin HEAD:main
